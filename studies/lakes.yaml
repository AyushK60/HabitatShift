# Glacial lakes for the version 3 time series.
# lon/lat must fall on or within a few hundred metres of the lake; half_deg is the half-width of the
# analysis box in degrees (about 111 km per degree). Coordinates were checked visually on radar and
# DEM images, not copied from a catalogue, so treat them as search anchors, not survey points.
lakes:
  - id: tsho_rolpa
    name: Tsho Rolpa
    lon: 86.476
    lat: 27.862
    half_deg: 0.045
    note: Moraine-dammed lake in the Rolwaling valley; partly in radar layover for one orbit.
  - id: imja_tsho
    name: Imja Tsho
    lon: 86.930
    lat: 27.900
    half_deg: 0.04
    note: Fast-growing lake below the Imja glacier; floating ice near the glacier front.
